name: hiflutter_store_file
description: >-
  path_provider and dart:io adapter for hiflutter_store: app-private file
  storage on Android and iOS behind the HiFileStore contract.
version: 0.1.0
repository: https://github.com/pcfprio/HiFlutter/tree/main/packages/hiflutter_store_file
issue_tracker: https://github.com/pcfprio/HiFlutter/issues
topics:
  - storage
  - files
  - path-provider

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  hiflutter_store: ^0.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hiflutter_base: ^0.1.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  test: ^1.26.0
