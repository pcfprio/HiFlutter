name: hiflutter_tool
description: >-
  Command-line tool for HiFlutter consumer projects to switch between source,
  pinned git tag, and hosted integration modes and run release checks.
version: 0.1.0
repository: https://github.com/pcfprio/HiFlutter/tree/main/packages/hiflutter_tool
issue_tracker: https://github.com/pcfprio/HiFlutter/issues
topics:
  - cli
  - developer-tools
  - workspace

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.0

executables:
  hiflutter: hiflutter
