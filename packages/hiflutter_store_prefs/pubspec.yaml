name: hiflutter_store_prefs
description: >-
  shared_preferences adapter for hiflutter_store: persistent key-value
  storage on Android and iOS behind the HiKeyValueStore contract.
version: 0.1.0
repository: https://github.com/pcfprio/HiFlutter/tree/main/packages/hiflutter_store_prefs
issue_tracker: https://github.com/pcfprio/HiFlutter/issues
topics:
  - storage
  - key-value
  - shared-preferences

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  hiflutter_store: ^0.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hiflutter_base: ^0.1.0
  shared_preferences_platform_interface: ^2.4.1
  test: ^1.26.0
