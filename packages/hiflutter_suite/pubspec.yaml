name: hiflutter_suite
description: >-
  Material 3 UI components of HiFlutter: localized state views, pagination
  controller and list view, and visual metrics aligned across platforms.
version: 0.1.0
repository: https://github.com/pcfprio/HiFlutter/tree/main/packages/hiflutter_suite
issue_tracker: https://github.com/pcfprio/HiFlutter/issues
topics:
  - ui
  - widgets
  - pagination
  - localization

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hiflutter_base: ^0.1.0
  hiflutter_core: ^0.1.0
  intl: ^0.20.2
  material_ui: ^1.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
