name: hiflutter_core
description: >-
  Flutter foundation of HiFlutter: one-call global error capture into the
  crash reporting contract, theme and color extensions, number and file size
  formatting, link detection, a dispose-safe value notifier, and app and
  device information contracts with User-Agent building.
version: 0.1.0
repository: https://github.com/pcfprio/HiFlutter/tree/main/packages/hiflutter_core
issue_tracker: https://github.com/pcfprio/HiFlutter/issues
topics:
  - error-handling
  - formatting
  - theme
  - utilities

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  hiflutter_base: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
