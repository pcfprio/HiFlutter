name: hiflutter_workspace
description: Workspace root for the HiFlutter packages. Not published.
publish_to: none

environment:
  sdk: ^3.14.0

workspace:
  - packages/hiflutter_base
  - packages/hiflutter_base_log_file
  - packages/hiflutter_core
  - packages/hiflutter_core_device
  - packages/hiflutter_nav
  - packages/hiflutter_nav_go_router
  - packages/hiflutter_nav_url_launcher
  - packages/hiflutter_net
  - packages/hiflutter_net_connectivity
  - packages/hiflutter_net_dio
  - packages/hiflutter_store
  - packages/hiflutter_store_prefs
  - packages/hiflutter_store_secure
  - packages/hiflutter_store_file
  - packages/hiflutter_suite
  - packages/hiflutter_tool

dev_dependencies:
  args: ^2.7.0
  lints: ^6.1.0
  path: ^1.9.1
  pub_semver: ^2.2.1
  test: ^1.26.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4
